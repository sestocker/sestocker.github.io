<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
  <title>{{ page.title }}</title>
  <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
  <meta name="viewport" content="width=device-width">
  <meta name="author" content="Scott Stocker" />
  <link href="https://www.stocker.foo/atom.xml" rel="alternate" title="Scott Stocker" type="application/atom+xml" />
  <style>
body {
    display: block;
    padding: 0px 20px;
    max-width: 550px;
    margin: 0 auto;
    background-color: rgba(0, 170, 194, 1);
    font: 16px helvetica, arial, clean, sans-serif;
	font-color: #FFF;
}

a {
	font-color: #FFF;
	text-decoration:none;
}

a:hover {
	font-color: #FFF;
	text-decoration:underline;
}

a:visited {
	font-color: #FFF;
	text-decoration:none;
}

#home ul {
    padding: 0;
    margin: 20px 0;
    line-height: 1.4rem;
}

#post ul {
    display: block;
    padding-bottom: 15px;
    list-style: disc;
}

#post ol {
    display: block;
    padding-bottom: 15px;
    list-style: decimal;
}

.slug-line {
    font-size: 1.1rem;
    margin-bottom: 15px;
}

.story-title {
    line-height: 2rem;
    font-size: 1.5rem;
    margin: 0;
}

.blog-heading {
    font-weight: bold;
    margin: 2em 0 2em 0;
    font-size: 2rem;
}

.blog-container>ul {
    padding: 0;
    line-height: 1.4rem;
}

.blog-container li {
    display: block;
    padding-bottom: 15px;
}

.blog-container {
    margin-top: 20px;
}

.topic-date {
    margin: 20px 0;
    font-style: italic;
}

.paragraphs-container {
    line-height: 1.5rem;
}


.lower-nav-container {
    margin-top: 40px;
}

.lower-nav-container li {
    margin-left: 0;
    display: inline;
    padding-right: 20px;
}

    </style>
</head>
<body>



 
  <main>
  <div class="blog-container">
    <h1 class="blog-heading">Hi, I'm Scott</h1>
      {{ content }}
  </div>
</main>

<footer>
  <nav class="lower-nav-container">
    <li>Connect with me on <a href="https://www.linkedin.com/in/scottstocker/">LinkedIn</a></li>
  </nav>
</footer>
</body>
</html>
